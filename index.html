<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tug'ilgan Kuningiz Bilan!</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Caveat', cursive;
            color: #f0e68c;
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 50px;
            z-index: 1;
            position: relative;
            max-width: 90%;
        }

        .text-section {
            text-align: left;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: #ffdda1;
            text-shadow: 0 0 10px rgba(255, 165, 0, 0.3);
            line-height: 1.2;
        }

        p {
            font-size: 1.8rem;
            margin: 15px 0;
            color: #ffbf00;
        }

        .sub-text {
            font-size: 1.2rem;
            color: #e38e55;
            margin-top: 20px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
                gap: 30px;
                width: 100%;
            }

            .text-section {
                text-align: left;
                width: 100%;
                padding-left: 20px;
                box-sizing: border-box;
            }

            h1 { font-size: 3rem; }
            p { font-size: 1.5rem; }
            .cake-container { transform: scale(0.85); }
        }

        .cake-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            cursor: pointer;
        }

        .plate {
            position: absolute;
            bottom: 0;
            width: 240px;
            height: 60px;
            background: #e0e0e0;
            border-radius: 50%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .cake-base {
            position: absolute;
            bottom: 15px;
            width: 200px;
            height: 100px;
            background: #d2691e;
            border-radius: 50% 50% 10px 10px;
            z-index: 2;
        }

        .cake-icing {
            position: absolute;
            bottom: 60px;
            width: 200px;
            height: 80px;
            background: #ff9aa2;
            border-radius: 50%;
            z-index: 3;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
        }

        .drip {
            position: absolute;
            top: 40px;
            width: 20px;
            height: 40px;
            background: #ff9aa2;
            border-radius: 0 0 20px 20px;
            z-index: 3;
        }
        .drip:nth-child(1) { left: 20px; height: 35px; }
        .drip:nth-child(2) { left: 50px; height: 50px; }
        .drip:nth-child(3) { left: 85px; height: 30px; }
        .drip:nth-child(4) { left: 120px; height: 45px; }
        .drip:nth-child(5) { left: 160px; height: 35px; }

        .candle {
            position: absolute;
            bottom: 110px;
            width: 15px;
            height: 60px;
            background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff69b4 5px, #ff69b4 10px);
            border-radius: 3px;
            z-index: 4;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .flame {
            position: absolute;
            bottom: 175px;
            width: 15px;
            height: 30px;
            background: radial-gradient(ellipse at bottom, #ffeb3b 0%, #ff9800 60%, #ff5722 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 20px #ffeb3b, 0 0 10px #ff9800;
            z-index: 5;
            animation: flicker 1s infinite alternate ease-in-out;
            transform-origin: center bottom;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 1; }
            25% { transform: scale(1.1) rotate(2deg); opacity: 0.9; }
            50% { transform: scale(0.9) rotate(-1deg); opacity: 1; }
            75% { transform: scale(1.05) rotate(1deg); opacity: 0.95; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .smoke {
            position: absolute;
            bottom: 180px;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            opacity: 0;
            z-index: 6;
        }

        .flame.off { display: none; }
        .smoke.puff { animation: smoke-rise 1.5s forwards; }

        @keyframes smoke-rise {
            0% { opacity: 0.6; transform: translateY(0) scale(1); }
            50% { opacity: 0.3; transform: translateY(-20px) scale(2); }
            100% { opacity: 0; transform: translateY(-40px) scale(3); }
        }

        .sprinkle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            z-index: 4;
        }
        .s1 { background: yellow; top: 20px; left: 40px; }
        .s2 { background: lightblue; top: 30px; left: 80px; }
        .s3 { background: limegreen; top: 15px; left: 120px; }
        .s4 { background: violet; top: 35px; left: 150px; }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <div class="text-section">
            <h1>Tug'ilgan kuniz bilan :)</h1>
            <p>Tortti ustiga bosin :)</p>
            <p>Keyin shamdi puflen !</p>
            <p class="sub-text" id="final-message"></p>
        </div>

        <div class="cake-container" onclick="blowCandle()">
            <div class="plate"></div>
            <div class="cake-base"></div>
            <div class="cake-icing">
                <div class="drip"></div>
                <div class="drip"></div>
                <div class="drip"></div>
                <div class="drip"></div>
                <div class="drip"></div>
                <div class="sprinkle s1"></div>
                <div class="sprinkle s2"></div>
                <div class="sprinkle s3"></div>
                <div class="sprinkle s4"></div>
            </div>
            <div class="candle"></div>
            <div class="flame" id="flame"></div>
            <div class="smoke" id="smoke"></div>
        </div>
    </div>

    <script>
        function blowCandle() {
            const flame = document.getElementById('flame');
            const smoke = document.getElementById('smoke');
            const message = document.getElementById('final-message');

            if (!flame.classList.contains('off')) {
                flame.classList.add('off');
                smoke.classList.add('puff');
                
                // THIS IS THE MESSAGE THAT APPEARS
                message.innerHTML = "Tilagingiz amalga oshsin!💝"; 
                
                startFireworks();
            }
        }

        // Fireworks Logic
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
                this.alpha = 1;
                this.friction = 0.96;
                this.gravity = 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.01;
            }
        }

        let particles = [];
        const colors = ['#ff69b4', '#ffeb3b', '#00d2ff', '#ff9aa2', '#f0e68c'];

        function createFirework(x, y) {
            const particleCount = 60;
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });
        }
        animate();

        function startFireworks() {
            let duration = 5000; 
            let end = Date.now() + duration;
            (function frame() {
                createFirework(Math.random() * canvas.width, Math.random() * (canvas.height / 2));
                if (Date.now() < end) setTimeout(frame, 300);
            }());
        }
    </script>
</body>
</html>
